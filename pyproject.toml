[project]
name = "kalshi-agent"
version = "0.1.0"
description = "Autonomous Kalshi trading agent: market collection, signals, edge detection, risk engine, paper/live execution, backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    "cryptography>=42.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
kalshi-agent = "kalshi_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/kalshi_agent/api/dashboard.html" = "kalshi_agent/api/dashboard.html"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:kalshi_agent.*"]

[tool.mypy]
python_version = "3.11"
packages = ["kalshi_agent"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
