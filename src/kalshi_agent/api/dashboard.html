<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalshi Agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #16191d;
    --muted: #6b7280;
    --accent: #2563eb;
    --pos: #15803d;
    --neg: #b91c1c;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --chip: #eef1f5;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a20; --border: #272c34; --text: #e7e9ee;
      --muted: #9aa3af; --accent: #60a5fa; --pos: #4ade80; --neg: #f87171;
      --warn: #fbbf24; --warn-bg: #3a2f10; --chip: #21262e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  .chip {
    background: var(--chip); border-radius: 999px; padding: 3px 10px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .tabs { display: flex; gap: 4px; padding: 12px 20px 0; }
  .tab {
    appearance: none; border: 1px solid var(--border); border-bottom: none;
    background: transparent; color: var(--muted); cursor: pointer;
    padding: 9px 18px; font-size: 14px; font-weight: 550;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--text); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main { padding: 0 20px 40px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 0 var(--radius) var(--radius) var(--radius); padding: 20px;
  }
  .banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-radius: var(--radius); margin-bottom: 18px;
    background: var(--warn-bg); color: var(--warn); font-size: 13px;
  }
  .banner.ok { background: transparent; color: var(--muted); padding-left: 0; }
  .tiles {
    display: grid; gap: 12px; margin-bottom: 22px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .tile .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .tile .value {
    font-size: 22px; font-weight: 620; margin-top: 4px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .05em; }
  tbody tr { border-top: 1px solid var(--border); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; min-width: 240px; color: var(--muted); }
  .badge { border-radius: 4px; padding: 1px 7px; font-size: 12px; background: var(--chip); }
  .badge.trade { background: color-mix(in srgb, var(--pos) 18%, transparent); color: var(--pos); }
  .badge.reject { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); }
  .badge.yes { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .empty { padding: 22px 14px; color: var(--muted); font-size: 13px; }
  button.action {
    appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 550;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 7px; padding: 6px 13px;
  }
  button.action:hover { border-color: var(--accent); }
  button.action.danger { color: var(--neg); }
  svg.spark { display: block; width: 100%; height: 64px; }
</style>
</head>
<body>
<header>
  <h1>Kalshi Agent</h1>
  <span class="chip" id="chip-env">exchange <b>—</b></span>
  <span class="chip" id="chip-strategy">strategy <b>—</b></span>
  <span class="chip" id="chip-mode">running <b>—</b></span>
  <span class="spacer"></span>
  <span class="chip" id="chip-updated">—</span>
  <button class="action" id="kill">Loading…</button>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-paper" aria-selected="true" aria-controls="panel">Paper trader</button>
  <button class="tab" role="tab" id="tab-live" aria-selected="false" aria-controls="panel">Live trader</button>
</div>

<main>
  <section class="panel" id="panel" role="tabpanel">
    <div class="banner" id="banner" hidden></div>
    <div class="tiles" id="tiles"></div>
    <div id="equity-wrap" hidden>
      <h2>Equity</h2>
      <div class="scroll" style="padding:10px 12px"><svg class="spark" id="equity" preserveAspectRatio="none"></svg></div>
    </div>
    <h2>Open positions</h2>
    <div class="scroll" id="positions"></div>
    <h2>Recent orders</h2>
    <div class="scroll" id="orders"></div>
    <h2>Recent decisions</h2>
    <div class="scroll" id="decisions"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let mode = (location.hash.replace("#", "") === "live") ? "live" : "paper";
let timer = null;

const money = (c) => (c == null ? "—" : (c / 100).toLocaleString("en-US", { style: "currency", currency: "USD" }));
const signed = (c) => (c == null ? "—" : (c > 0 ? "+" : "") + money(c));
const cls = (c) => (c == null || c === 0 ? "" : c > 0 ? "pos" : "neg");
const time = (t) => (t ? new Date(t).toLocaleTimeString("en-US", { hour12: false }) : "—");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

function table(cols, rows, render) {
  if (!rows.length) return '<div class="empty">Nothing yet.</div>';
  return `<table><thead><tr>${cols.map((c) => `<th${c.num ? ' style="text-align:right"' : ""}>${c.label}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(render).join("")}</tbody></table>`;
}

function sparkline(points) {
  const svg = $("equity");
  if (points.length < 2) { $("equity-wrap").hidden = true; return; }
  $("equity-wrap").hidden = false;
  const w = 600, h = 64, pad = 4;
  const min = Math.min(...points), max = Math.max(...points);
  const span = max - min || 1;
  const d = points.map((v, i) => {
    const x = pad + (i / (points.length - 1)) * (w - 2 * pad);
    const y = h - pad - ((v - min) / span) * (h - 2 * pad);
    return `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const up = points[points.length - 1] >= points[0];
  const color = up ? "var(--pos)" : "var(--neg)";
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="${color}" stroke-width="2"
    vector-effect="non-scaling-stroke" stroke-linejoin="round" />`;
}

function renderTiles(d) {
  const l = d.latest;
  const equity = l ? l.cash_cents + l.exposure_cents + l.unrealized_pnl_cents : null;
  const tiles = [
    ["Equity", equity == null ? "—" : money(equity), ""],
    ["Cash", l ? money(l.cash_cents) : "—", ""],
    ["Exposure", l ? money(l.exposure_cents) : "—", ""],
    ["Realized P&L", l ? signed(l.realized_pnl_cents) : "—", l ? cls(l.realized_pnl_cents) : ""],
    ["Unrealized", l ? signed(l.unrealized_pnl_cents) : "—", l ? cls(l.unrealized_pnl_cents) : ""],
    ["Fees paid", l ? money(l.fees_cents) : "—", ""],
    ["Positions", String(d.counts.positions), ""],
    ["Traded / rejected", `${d.counts.traded} / ${d.counts.rejected}`, ""],
  ];
  $("tiles").innerHTML = tiles.map(([label, value, c]) =>
    `<div class="tile"><div class="label">${label}</div><div class="value ${c}">${value}</div></div>`).join("");
}

function renderBanner(d) {
  const b = $("banner");
  if (d.kill_switch) {
    b.hidden = false; b.className = "banner";
    b.innerHTML = "Kill switch is engaged. No new orders will be placed in any mode.";
  } else if (!d.active) {
    b.hidden = false; b.className = "banner";
    b.innerHTML = `The agent is not running in <b>${d.mode}</b> mode right now, so this tab shows history only.
      Set <code>TRADING_MODE=${d.mode}</code> in <code>.env</code> and restart the engine to change that.`;
  } else {
    b.hidden = false; b.className = "banner ok";
    b.textContent = d.mode === "paper"
      ? "Paper mode: orders are simulated against the live order book. No real money moves."
      : "Live mode: orders are sent to Kalshi with real money.";
  }
}

function render(d) {
  renderBanner(d);
  renderTiles(d);
  sparkline(d.equity_curve.map((p) => p.cash_cents + p.exposure_cents + p.unrealized_pnl_cents));

  $("positions").innerHTML = table(
    [{ label: "Market" }, { label: "Side" }, { label: "Contracts", num: 1 },
     { label: "Avg cost", num: 1 }, { label: "Realized", num: 1 }, { label: "Fees", num: 1 }],
    d.positions,
    (p) => {
      const isYes = p.yes_contracts > 0;
      const n = isYes ? p.yes_contracts : p.no_contracts;
      const avg = isYes ? p.avg_yes_cost : p.avg_no_cost;
      return `<tr><td>${esc(p.ticker)}</td>
        <td><span class="badge ${isYes ? "yes" : ""}">${isYes ? "YES" : "NO"}</span></td>
        <td class="num">${n}</td><td class="num">${avg.toFixed(1)}&cent;</td>
        <td class="num ${cls(p.realized_pnl_cents)}">${signed(p.realized_pnl_cents)}</td>
        <td class="num">${money(p.fees_cents)}</td></tr>`;
    });

  $("orders").innerHTML = table(
    [{ label: "Time" }, { label: "Market" }, { label: "Side" }, { label: "Price", num: 1 },
     { label: "Count", num: 1 }, { label: "Filled", num: 1 }, { label: "Status" }],
    d.orders,
    (o) => `<tr><td>${time(o.created_at)}</td><td>${esc(o.ticker)}</td>
      <td><span class="badge ${o.side === "yes" ? "yes" : ""}">${o.side.toUpperCase()}</span></td>
      <td class="num">${o.price}&cent;</td><td class="num">${o.count}</td>
      <td class="num">${o.filled_count}</td><td>${esc(o.status)}</td></tr>`);

  $("decisions").innerHTML = table(
    [{ label: "Time" }, { label: "Market" }, { label: "Decision" }, { label: "Reason" }],
    d.decisions,
    (x) => `<tr><td>${time(x.ts)}</td><td>${esc(x.ticker)}</td>
      <td><span class="badge ${x.decision}">${esc(x.decision)}</span></td>
      <td class="wrap">${esc(x.reason)}</td></tr>`);

  $("chip-env").innerHTML = `exchange <b>${esc(d.kalshi_env)}</b>`;
  $("chip-strategy").innerHTML = `strategy <b>${esc(d.strategy)}</b>`;
  $("chip-mode").innerHTML = `running <b>${d.active ? d.mode : "not " + d.mode}</b>`;
  $("chip-updated").textContent = "updated " + new Date().toLocaleTimeString("en-US", { hour12: false });
  const kill = $("kill");
  kill.textContent = d.kill_switch ? "Release kill switch" : "Engage kill switch";
  kill.className = "action" + (d.kill_switch ? "" : " danger");
  kill.dataset.engaged = d.kill_switch ? "1" : "";
}

async function refresh() {
  try {
    const r = await fetch(`/dashboard/${mode}`, { cache: "no-store" });
    if (r.ok) render(await r.json());
  } catch (e) { $("chip-updated").textContent = "offline"; }
}

function select(next) {
  mode = next;
  location.hash = next;
  $("tab-paper").setAttribute("aria-selected", String(next === "paper"));
  $("tab-live").setAttribute("aria-selected", String(next === "live"));
  refresh();
}

$("tab-paper").onclick = () => select("paper");
$("tab-live").onclick = () => select("live");
$("kill").onclick = async () => {
  const engaged = $("kill").dataset.engaged;
  if (!engaged && !confirm("Engage the kill switch? The agent will stop placing new orders.")) return;
  await fetch("/kill-switch", { method: engaged ? "DELETE" : "POST" });
  refresh();
};

select(mode);
timer = setInterval(refresh, 5000);
</script>
</body>
</html>
